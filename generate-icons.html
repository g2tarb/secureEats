<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#6c5ce7');
  grad.addColorStop(1, '#00cec9');

  // Rounded rect
  const r = s * 0.2;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(s - r, 0);
  ctx.quadraticCurveTo(s, 0, s, r);
  ctx.lineTo(s, s - r);
  ctx.quadraticCurveTo(s, s, s - r, s);
  ctx.lineTo(r, s);
  ctx.quadraticCurveTo(0, s, 0, s - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fillStyle = grad;
  ctx.fill();

  // Lock icon
  ctx.strokeStyle = 'white';
  ctx.fillStyle = 'white';
  ctx.lineWidth = s * 0.04;
  ctx.lineCap = 'round';

  const cx = s / 2;
  const cy = s * 0.52;
  const bw = s * 0.32;
  const bh = s * 0.28;
  const br = s * 0.05;

  // Lock body
  ctx.beginPath();
  ctx.roundRect(cx - bw/2, cy - bh/2, bw, bh, br);
  ctx.fill();

  // Lock shackle
  const sw = s * 0.2;
  const sh = s * 0.15;
  ctx.beginPath();
  ctx.arc(cx, cy - bh/2, sw/2, Math.PI, 0);
  ctx.stroke();

  // Keyhole
  ctx.fillStyle = '#6c5ce7';
  ctx.beginPath();
  ctx.arc(cx, cy - s*0.02, s * 0.04, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(cx - s*0.015, cy, s*0.03, s*0.06);

  // QR pattern (small)
  const qs = s * 0.06;
  const qx = cx - qs * 2.5;
  const qy = cy + bh/2 + s * 0.04;
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 5; j++) {
      if ((i + j) % 2 === 0) {
        ctx.fillRect(qx + i * qs, qy, qs * 0.8, qs * 0.8);
      }
    }
  }
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

// Download links
['c192', 'c512'].forEach(id => {
  const c = document.getElementById(id);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = `icon-${c.width}.png`;
  a.textContent = `Download ${c.width}x${c.width}`;
  a.style.display = 'block';
  a.style.margin = '10px';
  document.body.appendChild(a);
});
</script>
</body>
</html>
